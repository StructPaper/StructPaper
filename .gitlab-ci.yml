# =============================================================================
# StructPaper - GitLab CI/CD
#
# Flow:
#   merge request  -> quality (lint, deps, unit tests) + build:verify (docker build, no push)
#   staging branch -> quality -> build:push (immutable :<sha>) -> deploy:staging (auto)
#   main branch    -> quality -> build:push (immutable :<sha>) -> deploy:production (manual)
#
# Design notes:
#   * Selective builds are CONTENT-ADDRESSED, not diff-based. The `plan` job hashes each image's
#     real inputs (app + transitive workspace deps + Dockerfile + lockfile, see
#     scripts/ci/image-plan.mjs). If `<image>:src-<hash>` already exists in the registry the build
#     is skipped and only the :<sha> tag is added. This is immune to failed/cancelled pipelines and
#     missed dependencies, which `rules:changes` is not. Force a rebuild (e.g. to pick up patched
#     base images) with a pipeline variable FORCE_REBUILD=true and FORCE_HASH_SALT=<any new value>,
#     ideally from a weekly pipeline schedule.
#   * Images are pushed once with an immutable :<sha> tag. The deploy job sends "deploy <sha>" to
#     the VM, which pins every service to :<sha> (scripts/deploy/deploy.sh). Environment tags
#     (:staging, :prod, :latest) are only moved AFTER a verified deploy and are informational.
#   * Rollback = re-run the deploy job of an older pipeline (it redeploys that older :<sha>).
#     Requires Settings > CI/CD > General pipelines > "Allow job retries for rollback deployments"
#     when "Prevent outdated deployment jobs" is enabled. Keep registry cleanup policies longer
#     than your rollback window (exclude ^[0-9a-f]{8}$ and ^src- tags).
#
# Required CI/CD variables (Protected):
#   DEPLOY_HOST, DEPLOY_USER
#   SSH_PRIVATE_KEY_STAGING  (environment scope: staging)
#   SSH_PRIVATE_KEY_PROD     (environment scope: production)
#   DEPLOY_KNOWN_HOSTS       (output of `ssh-keyscan -t ed25519 <host>`; mandatory for production)
# =============================================================================

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "staging" || $CI_COMMIT_BRANCH == "main"'

stages:
  - test
  - build
  - deploy

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""
  DOCKER_BUILDKIT: "1"
  PNPM_VERSION: "9.15.4"
  NODE_IMAGE: node:22-alpine
  DOCKER_IMAGE: docker:27
  DOCKER_DIND_IMAGE: docker:27-dind
  GIT_DEPTH: "20"

default:
  interruptible: true
  timeout: 30m
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
      - scheduler_failure

# -----------------------------------------------------------------------------
# Reusable templates
# -----------------------------------------------------------------------------
.build-rules:
  rules:
    - if: '$CI_COMMIT_BRANCH == "staging" || $CI_COMMIT_BRANCH == "main"'

.docker-base:
  image: $DOCKER_IMAGE
  services:
    - name: $DOCKER_DIND_IMAGE
      alias: docker
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"

# One matrix entry per image. Dockerfiles live next to the code they build.
.image-matrix:
  parallel:
    matrix:
      - SERVICE: api
        DOCKERFILE: apps/api/Dockerfile
        HASH_VAR: HASH_API
      - SERVICE: worker
        DOCKERFILE: apps/worker/Dockerfile
        HASH_VAR: HASH_WORKER
      - SERVICE: web
        DOCKERFILE: apps/web/Dockerfile
        HASH_VAR: HASH_WEB
      - SERVICE: db-init
        DOCKERFILE: docker/db-init.Dockerfile
        HASH_VAR: HASH_DB_INIT

# -----------------------------------------------------------------------------
# STAGE: test - quality gates (run on MRs and on staging/main)
# -----------------------------------------------------------------------------
# Computes the per-image source hashes used to skip unchanged builds (see header notes).
plan:
  stage: test
  image: $NODE_IMAGE
  tags:
    - test
  variables:
    GIT_DEPTH: "1"
  script:
    - node scripts/ci/image-plan.mjs --out plan.env
  artifacts:
    reports:
      dotenv: plan.env
    expire_in: 1 day
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "staging" || $CI_COMMIT_BRANCH == "main"'

quality:
  stage: test
  image: $NODE_IMAGE
  tags:
    - test
  before_script:
    - corepack enable && corepack prepare pnpm@$PNPM_VERSION --activate
    - pnpm config set store-dir "$CI_PROJECT_DIR/.pnpm-store"
  script:
    - pnpm install --frozen-lockfile --prefer-offline
    - pnpm lint
    - pnpm deps:check
    - pnpm --filter @structpaper/contracts build
    - pnpm --filter @structpaper/db build
    - pnpm --filter @structpaper/api build
    - pnpm --filter @structpaper/worker build
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "staging" || $CI_COMMIT_BRANCH == "main"'

# Offline tests for the VM-side deploy scripts (stubbed docker/curl/sudo). Blocking: a broken
# deploy.sh or forced-command wrapper must never reach a server.
deploy-scripts:
  stage: test
  image: $NODE_IMAGE
  tags:
    - test
  variables:
    GIT_DEPTH: "1"
  before_script:
    - apk add --no-cache bash
  script:
    - bash -n scripts/deploy/deploy.sh
    - bash -n scripts/deploy/validate-and-deploy.sh
    - bash scripts/deploy/test-deploy-scripts.sh
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "staging" || $CI_COMMIT_BRANCH == "main"'

# Dependency vulnerability scan (production deps). Non-blocking until the baseline is clean.
audit:
  stage: test
  image: $NODE_IMAGE
  tags:
    - test
  allow_failure: true
  before_script:
    - corepack enable && corepack prepare pnpm@$PNPM_VERSION --activate
  script:
    - pnpm audit --prod --audit-level=high
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "staging" || $CI_COMMIT_BRANCH == "main"'

# Unit tests run on every pipeline. Currently NON-blocking: at the time this pipeline was
# rewritten 13 test files already failed on the main codebase (stale web/editor route
# assertions, db schema seed expectations, architecture and latex/tectonic tests).
# Once they are fixed or quarantined, delete `allow_failure` to make the gate blocking.
unit-tests:
  stage: test
  image: $NODE_IMAGE
  tags:
    - test
  allow_failure: true
  before_script:
    - corepack enable && corepack prepare pnpm@$PNPM_VERSION --activate
    - pnpm config set store-dir "$CI_PROJECT_DIR/.pnpm-store"
  script:
    - pnpm install --frozen-lockfile --prefer-offline
    - pnpm test
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "staging" || $CI_COMMIT_BRANCH == "main"'

# -----------------------------------------------------------------------------
# STAGE: build
# -----------------------------------------------------------------------------
# Merge requests: prove changed images build, push nothing (unchanged ones are skipped).
build:verify:
  extends:
    - .docker-base
    - .image-matrix
  stage: build
  tags:
    - build
  needs:
    - job: plan
      artifacts: true
    - job: quality
  script:
    - sh scripts/ci/build-image.sh verify
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

# staging/main: build only images whose source hash is new; push :<sha> and :src-<hash>.
build:push:
  extends:
    - .docker-base
    - .image-matrix
    - .build-rules
  stage: build
  tags:
    - build
  needs:
    - job: plan
      artifacts: true
    - job: quality
  script:
    - sh scripts/ci/build-image.sh push
# -----------------------------------------------------------------------------
# STAGE: deploy - execute SSH deploy with commit SHA, then retag on success
# -----------------------------------------------------------------------------
.deploy:
  stage: deploy
  image: $DOCKER_IMAGE
  interruptible: false
  timeout: 20m
  variables:
    GIT_STRATEGY: none
  script:
    - |
      for required in DEPLOY_HOST DEPLOY_USER SSH_PRIVATE_KEY DEPLOY_TAGS; do
        eval "value=\${$required:-}"
        if [ -z "$value" ]; then
          echo "ERROR: $required is empty. Protected variables are only exposed on protected branches."
          exit 1
        fi
      done
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - |
      if [ -n "${DEPLOY_KNOWN_HOSTS:-}" ]; then
        printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
      elif [ "${REQUIRE_KNOWN_HOSTS:-false}" = "true" ]; then
        echo "ERROR: DEPLOY_KNOWN_HOSTS is required for $CI_ENVIRONMENT_NAME (no trust-on-first-use)."
        exit 1
      else
        echo "WARNING: DEPLOY_KNOWN_HOSTS not set, falling back to ssh-keyscan (trust on first use)."
        ssh-keyscan -T 10 -t ed25519 "$DEPLOY_HOST" > ~/.ssh/known_hosts
      fi
    - |
      # A "File" type variable holds a path, not the key itself.
      if [ -f "$SSH_PRIVATE_KEY" ]; then cp "$SSH_PRIVATE_KEY" ~/.ssh/id_deploy
      else printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_deploy; fi
    - chmod 600 ~/.ssh/id_deploy ~/.ssh/known_hosts
    - |
      # Retag the environment tags (:staging / :prod / :latest) on the registry BEFORE SSH deploy
      # so that both SHA pinning and fallback :staging tags in .env are guaranteed to exist.
      echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
      for service in api worker web db-init; do
        for tag in $DEPLOY_TAGS; do
          docker buildx imagetools create \
            --tag "$CI_REGISTRY_IMAGE/$service:$tag" \
            "$CI_REGISTRY_IMAGE/$service:$CI_COMMIT_SHORT_SHA"
        done
      done
    # The VM pins every image to :<sha> (forced command -> validate-and-deploy.sh -> deploy.sh),
    # or falls back to the newly retagged environment tags in .env.
    - >
      ssh -i ~/.ssh/id_deploy
      -o IdentitiesOnly=yes
      -o BatchMode=yes
      -o StrictHostKeyChecking=yes
      -o ConnectTimeout=15
      -o ServerAliveInterval=30
      "$DEPLOY_USER@$DEPLOY_HOST" "deploy $CI_COMMIT_SHORT_SHA"
  after_script:
    - rm -f ~/.ssh/id_deploy
    - docker logout "$CI_REGISTRY" 2>/dev/null || true

# Scope SSH_PRIVATE_KEY_STAGING to environment "staging" and SSH_PRIVATE_KEY_PROD to
# "production" (Settings > CI/CD > Variables > Environment scope). Protected alone is not
# enough: every protected branch, including staging, would receive the production key.
# NOTE: GitLab does not support shell defaults like ${VAR:-fallback} in `variables:`.
deploy:staging:
  extends: .deploy
  tags:
    - deploystaging
  resource_group: staging
  needs:
    - job: quality
    - job: deploy-scripts
    - job: build:push
      artifacts: false
  variables:
    GIT_STRATEGY: none
    SSH_PRIVATE_KEY: $SSH_PRIVATE_KEY_STAGING
    DEPLOY_TAGS: staging
  environment:
    name: staging
    url: http://$DEPLOY_HOST:3100
  rules:
    - if: '$CI_COMMIT_BRANCH == "staging"'

deploy:production:
  extends: .deploy
  tags:
    - deployproduction
  resource_group: production
  needs:
    - job: quality
    - job: deploy-scripts
    - job: unit-tests
    - job: build:push
      artifacts: false
  variables:
    GIT_STRATEGY: none
    SSH_PRIVATE_KEY: $SSH_PRIVATE_KEY_PROD
    DEPLOY_TAGS: prod latest
    REQUIRE_KNOWN_HOSTS: "true"
  environment:
    name: production
    url: http://$DEPLOY_HOST:3000
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
      allow_failure: false
