name: structpaper-dev

services:
  postgres:
    image: postgres:16-alpine
    container_name: structpaper-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-structpaper}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-structpaper}
      POSTGRES_DB: ${POSTGRES_DB:-structpaper}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      - ./docker/postgres/init-extensions.sql:/docker-entrypoint-initdb.d/01-init-extensions.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-structpaper} -d ${POSTGRES_DB:-structpaper}']
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  minio:
    image: minio/minio:RELEASE.2024-01-18T22-51-28Z
    container_name: structpaper-minio-dev
    restart: unless-stopped
    ports:
      - '9000:9000'
      - '9001:9001'
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    volumes:
      - minio_dev_data:/data
    entrypoint:
      - /bin/sh
      - -c
      - >
        mkdir -p /data/structpaper-dev &&
        exec minio server /data --console-address ":9001"
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  minio-init:
    image: minio/minio:RELEASE.2024-01-18T22-51-28Z
    container_name: structpaper-minio-init-dev
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${S3_ACCESS_KEY:-minioadmin} $${S3_SECRET_KEY:-minioadmin} &&
      mc mb local/$${S3_BUCKET:-structpaper-dev} --ignore-existing &&
      mc anonymous set download local/$${S3_BUCKET:-structpaper-dev} || true &&
      exit 0
      "

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: dev
    container_name: structpaper-api-dev
    restart: unless-stopped
    ports:
      - '3001:3001'
    environment:
      NODE_ENV: development
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-structpaper}:${POSTGRES_PASSWORD:-structpaper}@postgres:5432/${POSTGRES_DB:-structpaper}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-structpaper-dev}
      S3_REGION: ${S3_REGION:-us-east-1}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev-jwt-access-secret-32-chars-minimum!}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-jwt-refresh-secret-32-chars-minimum!}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-admin@structpaper.org}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-AdminPassword123!}
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/api/node_modules
      - /app/packages/contracts/node_modules
      - /app/packages/db/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
      target: dev
    container_name: structpaper-worker-dev
    restart: unless-stopped
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://${POSTGRES_USER:-structpaper}:${POSTGRES_PASSWORD:-structpaper}@postgres:5432/${POSTGRES_DB:-structpaper}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-structpaper-dev}
      S3_REGION: ${S3_REGION:-us-east-1}
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/worker/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: dev
    container_name: structpaper-web-dev
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: development
      PORT: 3000
      WATCHPACK_POLLING: 'true'
      NEXT_PUBLIC_API_URL: http://localhost:3001
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/web/node_modules
      - /app/apps/web/.next
    depends_on:
      api:
        condition: service_started

volumes:
  postgres_dev_data:
  minio_dev_data:
