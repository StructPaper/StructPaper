name: structpaper

services:
  postgres:
    image: postgres:16-alpine
    container_name: structpaper-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-structpaper}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-structpaper}
      POSTGRES_DB: ${POSTGRES_DB:-structpaper}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-extensions.sql:/docker-entrypoint-initdb.d/01-init-extensions.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-structpaper} -d ${POSTGRES_DB:-structpaper}']
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  minio:
    image: minio/minio:RELEASE.2024-01-18T22-51-28Z
    container_name: structpaper-minio
    restart: unless-stopped
    ports:
      - '9000:9000'
      - '9001:9001'
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    entrypoint:
      - /bin/sh
      - -c
      - >
        mkdir -p /data/structpaper-dev &&
        exec minio server /data --console-address ":9001"
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  minio-init:
    image: minio/minio:RELEASE.2024-01-18T22-51-28Z
    container_name: structpaper-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb local/structpaper-dev --ignore-existing &&
      mc anonymous set download local/structpaper-dev || true &&
      exit 0
      "

volumes:
  postgres_data:
  minio_data:
