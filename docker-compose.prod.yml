# Full Docker stack (web + api + worker) for ONE environment. It only PULLS and RUNS prebuilt
# images (no build). Postgres + MinIO are shared infra already running on the VM (network `infra`),
# so they are NOT defined here. Each environment uses its own DB/user + bucket/user.
#
# Usage: one FOLDER per environment on the VM, each holding a copy of this file (renamed
# docker-compose.yaml) and its own .env:
#
#   ~/infra/app-cheban-staging/{docker-compose.yaml,.env}
#   ~/infra/app-cheban-prod/{docker-compose.yaml,.env}
#
# then, inside each folder:  docker compose up -d
# (the folder name becomes the project name, so containers/volumes never collide;
#  image names, ports and secrets differ per environment via .env).
#
# db-init (extensions + migrate + seed, idempotent) runs first, then api / worker / web.
#
# Network design: only api/worker/db-init join `infra` (to reach Postgres/MinIO). The web talks
# to the api over the project's PRIVATE default network, so the alias `api` never collides
# between environments (or with other apps) on the shared `infra` network.
networks:
  infra:
    external: true
    name: infra

x-app-env: &app-env
  NODE_ENV: production
  DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in the env file}
  S3_ENDPOINT: ${S3_ENDPOINT:?set S3_ENDPOINT in the env file}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY in the env file}
  S3_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY in the env file}
  S3_BUCKET: ${S3_BUCKET:?set S3_BUCKET in the env file}
  S3_REGION: ${S3_REGION:-us-east-1}

services:
  db-init:
    image: ${DB_INIT_IMAGE:?set DB_INIT_IMAGE in the env file}
    restart: 'no'
    networks: [default, infra]
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in the env file}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:?set INITIAL_ADMIN_EMAIL in the env file}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:?set INITIAL_ADMIN_PASSWORD in the env file}
    command: >
      /bin/sh -c "
      apk add --no-cache postgresql-client >/dev/null &&
      (psql \"$$DATABASE_URL\" -c 'CREATE EXTENSION IF NOT EXISTS citext' -c 'CREATE EXTENSION IF NOT EXISTS pg_trgm' -c 'CREATE EXTENSION IF NOT EXISTS unaccent' || echo 'WARN: could not create extensions (need superuser?)') &&
      pnpm --filter @structpaper/db migrate &&
      pnpm --filter @structpaper/db seed
      "

  api:
    image: ${API_IMAGE:?set API_IMAGE in the env file}
    restart: always
    networks: [default, infra]
    ports:
      - '${BIND_ADDR:-127.0.0.1}:${API_PORT:-3001}:3001'
    environment:
      <<: *app-env
      PORT: 3001
      CORS_ORIGIN: ${CORS_ORIGIN:?set CORS_ORIGIN in the env file}
      APP_URL: ${APP_URL:-}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in the env file}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-}
      COMPILE_TIMEOUT_MS: ${COMPILE_TIMEOUT_MS:-300000}
    volumes:
      - tectonic_cache:/root/.cache/Tectonic
    depends_on:
      db-init:
        condition: service_completed_successfully

  worker:
    image: ${WORKER_IMAGE:?set WORKER_IMAGE in the env file}
    restart: always
    networks: [default, infra]
    environment:
      <<: *app-env
    depends_on:
      db-init:
        condition: service_completed_successfully

  web:
    image: ${WEB_IMAGE:?set WEB_IMAGE in the env file}
    restart: always
    networks: [default]
    ports:
      - '${BIND_ADDR:-127.0.0.1}:${WEB_PORT:-3000}:3000'
    environment:
      NODE_ENV: production
      PORT: 3000
      INTERNAL_API_URL: http://api:3001
    depends_on:
      api:
        condition: service_started

volumes:
  tectonic_cache:
