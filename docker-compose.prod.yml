name: structpaper-prod

services:
  postgres:
    image: postgres:16-alpine
    container_name: structpaper-postgres-prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-structpaper}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-structpaper}
      POSTGRES_DB: ${POSTGRES_DB:-structpaper}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
      - ./docker/postgres/init-extensions.sql:/docker-entrypoint-initdb.d/01-init-extensions.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-structpaper} -d ${POSTGRES_DB:-structpaper}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  minio:
    image: minio/minio:RELEASE.2024-01-18T22-51-28Z
    container_name: structpaper-minio-prod
    restart: always
    ports:
      - '9000:9000'
      - '9001:9001'
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    volumes:
      - minio_prod_data:/data
    entrypoint:
      - /bin/sh
      - -c
      - >
        mkdir -p /data/${S3_BUCKET:-structpaper-prod} &&
        exec minio server /data --console-address ":9001"
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  minio-init:
    image: minio/minio:RELEASE.2024-01-18T22-51-28Z
    container_name: structpaper-minio-init-prod
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${S3_ACCESS_KEY:-minioadmin} $${S3_SECRET_KEY:-minioadmin} &&
      mc mb local/$${S3_BUCKET:-structpaper-prod} --ignore-existing &&
      mc anonymous set download local/$${S3_BUCKET:-structpaper-prod} || true &&
      exit 0
      "

  db-init:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: dev
    container_name: structpaper-db-init-prod
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-structpaper}:${POSTGRES_PASSWORD:-structpaper}@postgres:5432/${POSTGRES_DB:-structpaper}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-admin@structpaper.org}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-AdminPassword123!}
    command: >
      /bin/sh -c "
      pnpm --filter @structpaper/db migrate &&
      pnpm --filter @structpaper/db seed &&
      exit 0
      "
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runner
    container_name: structpaper-api-prod
    restart: always
    ports:
      - '3001:3001'
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-structpaper}:${POSTGRES_PASSWORD:-structpaper}@postgres:5432/${POSTGRES_DB:-structpaper}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-structpaper-prod}
      S3_REGION: ${S3_REGION:-us-east-1}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-prod-jwt-access-secret-replace-in-env-32-chars!}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-prod-jwt-refresh-secret-replace-in-env-32-chars!}
    depends_on:
      postgres:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
      target: runner
    container_name: structpaper-worker-prod
    restart: always
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-structpaper}:${POSTGRES_PASSWORD:-structpaper}@postgres:5432/${POSTGRES_DB:-structpaper}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-structpaper-prod}
      S3_REGION: ${S3_REGION:-us-east-1}
    depends_on:
      postgres:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: runner
    container_name: structpaper-web-prod
    restart: always
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
    depends_on:
      api:
        condition: service_started

volumes:
  postgres_prod_data:
  minio_prod_data:
